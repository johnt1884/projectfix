        App.renderer.renderVideosInternal = async function(isNewOnly = false, sortBy = "name-asc", isShortcutsOnly = false) {
            console.log(`Starting App.renderer.renderVideosInternal (isNewOnly=${isNewOnly}, isShortcutsOnly=${isShortcutsOnly}, state.currentMode=${state.currentMode})`);

            App.renderer.resetState();
            const projectFolders = await App.renderer.scanProjectFolders(isNewOnly);
            await App.renderer.resolveProjectPaths(projectFolders);

            let firstCanvasRendered = false;
            for (const project of projectFolders) {
                try {
                    const canvasData = await App.renderer.prepareCanvasData(project, isNewOnly, sortBy, isShortcutsOnly);
                    if (!canvasData) continue;

                    const canvasId = App.utils.getNextCanvasId();
                    const canvasElements = App.renderer.buildCanvasDOM(project, canvasData, isNewOnly);

                    state.canvases.set(canvasId, { id: canvasId, name: project.name, elements: canvasElements, path: project.path });

                    if (!firstCanvasRendered && state.canvases.size > 0) {
                        App.renderer.renderCanvas(state.canvases.keys().next().value);
                        firstCanvasRendered = true;
                    }
                    App.ui.populateCanvasDropdown();
                    await new Promise(r => setTimeout(r, 0));
                } catch (err) {
                    console.error(`Error processing project ${project.name}:`, err);
                }
            }

            if (state.canvases.size > 0 && !firstCanvasRendered) {
                App.renderer.renderCanvas(state.canvases.keys().next().value);
            } else if (state.canvases.size === 0) {
                elements.thumbnailContainer.innerHTML = "";
            }
            App.ui.populateCanvasDropdown();
        };

        App.renderer.resetState = function() {
            if (state.currentMode === "root-sc" || state.currentMode === "update-playlist-root") {
                state.g_rootHandle = state.currentDirHandle;
            }
            state.createdObjectUrls.forEach(URL.revokeObjectURL);
            state.createdObjectUrls = [];
            state.canvases.clear();
            state.shortcutSelections.clear();
            state.initialShortcutSelections.clear();
            state.videoCategories.clear();
            state.editModeRotatedVideos.clear();
            state.initialVideoCategories.clear();
            state.projectCategories.clear();
            elements.thumbnailContainer.innerHTML = "";
            state.allVideoFiles = [];
        };

        App.renderer.scanProjectFolders = async function(isNewOnly) {
            const projectFolders = [];
            async function findProjectFolders(dirHandle, currentPath = "") {
                 for await (const entry of dirHandle.values()) {
                    if (entry.kind === "directory" && !App.config.skipDirs.has(entry.name.toLowerCase())) {
                        const newPath = currentPath ? `${currentPath}\\${entry.name}` : entry.name;
                        try {
                            await App.utils.findDirectoryHandleByName(entry, "Edit Thumbnails");
                            let timestamp = isNewOnly ? (await App.utils.getTimestamp(entry)) || 0 : 0;
                            projectFolders.push({ handle: entry, path: newPath, name: entry.name, timestamp });
                        } catch (e) {
                           await findProjectFolders(entry, newPath);
                        }
                    }
                }
            }
            
            try {
                await App.utils.findDirectoryHandleByName(state.currentDirHandle, "Edit Thumbnails");
                let timestamp = isNewOnly ? (await App.utils.getTimestamp(state.currentDirHandle)) || 0 : 0;
                projectFolders.push({ handle: state.currentDirHandle, path: "", name: state.currentDirHandle.name, timestamp });
            } catch (e) {
                await findProjectFolders(state.currentDirHandle, "");
            }
            return projectFolders.sort((a, b) => a.name.localeCompare(b.name));
        };

        App.renderer.resolveProjectPaths = async function(projectFolders) {
            let isProject = false;
            try {
                await App.utils.findDirectoryHandleByName(state.currentDirHandle, "Edit Thumbnails");
                isProject = true;
            } catch (e) {}

            let currentDirScData = isProject ? new Map() : await App.utils.getRootScData(state.currentDirHandle);
            const hasProjectHeaders = Array.from(currentDirScData.keys()).some(k => k !== "");

            if (hasProjectHeaders || (currentDirScData.size > 0 && !isProject)) {
                state.g_rootHandle = state.currentDirHandle;
                state.rootScData = currentDirScData;
            } else if (state.g_rootHandle) {
                state.rootScData = await App.utils.getRootScData(state.g_rootHandle);
            }

            if (state.g_rootHandle) {
                for (const project of projectFolders) {
                    try {
                        const relativePathParts = await state.g_rootHandle.resolve(project.handle);
                        if (relativePathParts) project.path = relativePathParts.join("\\");
                    } catch (e) {}
                }
            }
            state.allProjectFolders = [...projectFolders];
        };

        App.renderer.prepareCanvasData = async function(project, isNewOnly, sortBy, isShortcutsOnly) {
            console.log(`Preparing project: ${project.name}`);
            await App.utils.getMiscData(project.handle, project.path);
            const projectScData = await App.utils.getScDataForProject(project.handle);
            const projectRotationData = await App.utils.getRotationData(project.handle);
            const rootScData = state.rootScData || new Map();

            const normalizedProjectName = App.utils.normalizeProjectKey(project.name);
            const normalizedProjectPath = App.utils.normalizeProjectKey(project.path);
            let rootProjectShortcutsSet = rootScData.get(normalizedProjectName) || rootScData.get(normalizedProjectPath) || new Set();

            const projectVideoFiles = [];
            await App.renderer.findVideosRecursive(project.handle, "", projectVideoFiles, isNewOnly, project.timestamp);
            state.allVideoFiles.push(...projectVideoFiles);

            const editDirHandle = await App.utils.findDirectoryHandleByName(project.handle, "Edit Thumbnails");
            const landscapeFiles = [];
            for await (const entry of editDirHandle.values()) {
                if (entry.kind === "file" && entry.name.match(/\.(jpe?g|png|gif|webp)$/i)) landscapeFiles.push(await entry.getFile());
            }

            const groupedFiles = landscapeFiles.reduce((acc, file) => {
                const match = file.name.match(/^(.*?)_(\d+)\.[^.]+$/);
                if (match) {
                    const videoName = match[1];
                    if (!acc[videoName]) acc[videoName] = [];
                    acc[videoName].push(file);
                }
                return acc;
            }, {});

            const videoFileMap = new Map(projectVideoFiles.map(f => [f.name.substring(0, f.name.lastIndexOf(".")), f]));
            let videoNames = Object.keys(groupedFiles).sort((a, b) => App.renderer.sortVideos(a, b, sortBy, videoFileMap));

            const preparedRows = [];
            for (const videoName of videoNames) {
                const rowData = await App.renderer.prepareRowData(videoName, videoFileMap, project, projectScData, rootProjectShortcutsSet, isShortcutsOnly, isNewOnly, groupedFiles);
                if (rowData) preparedRows.push(rowData);
            }

            return preparedRows.length > 0 ? { preparedRows, projectRotationData } : null;
        };

        App.renderer.findVideosRecursive = async function(dirHandle, subfolder, projectVideoFiles, isNewOnly, timestampLimit) {
            for await (const entry of dirHandle.values()) {
                if (entry.kind === "file" && entry.name.match(/\.(mp4|avi|mov|mkv)$/i)) {
                    try {
                        const file = await entry.getFile();
                        if (!isNewOnly || file.lastModified > timestampLimit) {
                            file.subfolder = subfolder;
                            file.projectPath = state.allProjectFolders.find(p => p.handle === dirHandle)?.path || "";
                            projectVideoFiles.push(file);
                        }
                    } catch (e) {}
                } else if (entry.kind === "directory" && !App.config.skipDirs.has(entry.name.toLowerCase())) {
                    await App.renderer.findVideosRecursive(entry, subfolder ? `${subfolder}\\${entry.name}` : entry.name, projectVideoFiles, isNewOnly, timestampLimit);
                }
            }
        };

        App.renderer.sortVideos = function(a, b, sortBy, videoFileMap) {
            if (sortBy === "name-asc") return a.localeCompare(b);
            if (sortBy === "name-desc") return b.localeCompare(a);
            const fileA = videoFileMap.get(a), fileB = videoFileMap.get(b);
            const dateA = fileA ? fileA.lastModified : 0, dateB = fileB ? fileB.lastModified : 0;
            return sortBy === "date-new" ? dateB - dateA : dateA - dateB;
        };

        App.renderer.prepareRowData = async function(videoName, videoFileMap, project, projectScData, rootProjectShortcutsSet, isShortcutsOnly, isNewOnly, groupedFiles) {
            const videoFile = videoFileMap.get(videoName);
            if (!videoFile) return null;

            const hasProjectSc = App.utils.checkShortcut(videoFile.name, projectScData);
            let rootScEntry = App.utils.checkShortcut(videoFile.name, rootProjectShortcutsSet);
            let hasRootSc = rootScEntry !== false;

            if (isShortcutsOnly && !hasProjectSc && !hasRootSc) return null;

            const files = groupedFiles[videoName].sort((a, b) => {
                const aNum = parseInt(a.name.substring(a.name.lastIndexOf("_") + 1));
                const bNum = parseInt(b.name.substring(b.name.lastIndexOf("_") + 1));
                return aNum - bNum;
            });

            return { videoFile, files, hasProjectSc, hasRootSc, rootScEntry };
        };

        App.renderer.buildCanvasDOM = function(project, canvasData, isNewOnly) {
            const { preparedRows, projectRotationData } = canvasData;
            const canvasElements = [];

            const groupHeader = document.createElement("h2");
            groupHeader.className = "project-header";
            groupHeader.innerHTML = `<span>${(state.currentMode === "root-sc" || state.currentMode === "sc") ? "Root Shortcuts: " : ""}${project.name} (${preparedRows.length} videos)</span>`;
            canvasElements.push(groupHeader);

            for (const rowData of preparedRows) {
                const rowDiv = App.renderer.createRowElement(rowData, project, projectRotationData);
                canvasElements.push(rowDiv);
            }
            canvasElements.push(document.createElement("hr"));

        App.renderer.createRowElement = function(rowData, project, projectRotationData) {
            const { videoFile, files, hasProjectSc, hasRootSc, rootScEntry } = rowData;
            const rowDiv = document.createElement("div");

            rowDiv.dataset.videoName = videoFile.name;
            rowDiv.dataset.projectPath = project.path;

            rowDiv.appendChild(thumbnailsContainer);

            const rotData = projectRotationData.get(videoFile.name.toLowerCase()) || { rotation: "0", flipped: false };
            const key = project.path + "|" + videoFile.name;

            if (!state.shortcutSelections.has(key)) {
                let initialShortcutType = "";
                if (rootScEntry && typeof rootScEntry === "string") {
                    if (rootScEntry === "BOTH") initialShortcutType = "both-sc";
                    else if (rootScEntry === "ROOT") initialShortcutType = "root-sc";
                }
                if (!initialShortcutType) {
                    if (hasProjectSc && hasRootSc) initialShortcutType = "both-sc";
                    else if (hasProjectSc) initialShortcutType = "subfolder-sc";
                    else if (hasRootSc) initialShortcutType = "root-sc";
                }

                state.shortcutSelections.set(key, {
                    videoName: videoFile.name, projectPath: project.path, subfolder: videoFile.subfolder,
                    projectName: project.name, type: initialShortcutType,

                if (rotData.flipped) img.classList.add("flipped");

                    img.dataset.originalWidth = img.width;
                    img.dataset.originalHeight = img.height;

                const url = URL.createObjectURL(file);
                state.createdObjectUrls.push(url);

        App.renderer.renderScNewMode = async function() {
            console.log("--- Starting App.renderer.renderScNewMode (v2) ---");
            App.renderer.resetState();

            try {
                const scnewHandle = await state.currentDirHandle.getFileHandle("scnew.txt");
                const scnewFile = await scnewHandle.getFile();
                const scnewText = await scnewFile.text();
                const shortcutPaths = scnewText.split("\n").map(line => line.trim()).filter(line => line);

                if (shortcutPaths.length === 0) {
                    elements.thumbnailContainer.innerHTML = "<p style=\"color: black;\">scnew.txt is empty. No new shortcuts to display.</p>";
                    return;
                }
                
                const groupedBySubfolder = App.renderer.groupShortcutsBySubfolder(shortcutPaths);
                for (const [subfolderName, shortcutFileNames] of groupedBySubfolder.entries()) {
                    await App.renderer.processScNewSubfolder(subfolderName, shortcutFileNames);
                }

                if (state.canvases.size > 0) {
                    App.renderer.renderCanvas(state.canvases.keys().next().value);
                } else {
                    App.ui.populateCanvasDropdown();
                    elements.thumbnailContainer.innerHTML = "<p style=\"color: black;\">No new shortcuts found to display.</p>";
                }
            } catch (err) {
                console.error("Caught error in App.renderer.renderScNewMode:", err);
                elements.thumbnailContainer.innerHTML = `<p style=\"color: red;\">Error: Could not read or process scnew.txt. Please ensure the file exists and is correctly formatted.</p><p style=\"color: red; font-size: 0.8em;\">${err.message}</p>`;
            }
        };

        App.renderer.groupShortcutsBySubfolder = function(shortcutPaths) {
            const grouped = new Map();
            for (const path of shortcutPaths) {
                const parts = path.split("\\");
                if (parts.length >= 3) {
                    const subfolderName = parts[parts.length - 3];
                    const shortcutFileName = parts[parts.length - 1];
                    if (!grouped.has(subfolderName)) grouped.set(subfolderName, []);
                    grouped.get(subfolderName).push(shortcutFileName);
                }
            }
            return grouped;
        };

        App.renderer.processScNewSubfolder = async function(subfolderName, shortcutFileNames) {
            console.log(`Processing subfolder: ${subfolderName}`);
            const subfolderHandle = await state.currentDirHandle.getDirectoryHandle(subfolderName);
            const projectRotationData = await App.utils.getRotationData(subfolderHandle);
            const editDirHandle = await App.utils.findDirectoryHandleByName(subfolderHandle, "Edit Thumbnails");

            const canvasId = App.utils.getNextCanvasId();
            const canvasElements = [];
            const header = document.createElement("h2");
            header.className = "project-header";
            canvasElements.push(header);

            let projectVideoCount = 0;
            for (const shortcutFileName of shortcutFileNames) {
                const rowDiv = await App.renderer.prepareScNewRow(subfolderHandle, subfolderName, shortcutFileName, editDirHandle, projectRotationData);
                if (rowDiv) {
                    canvasElements.push(rowDiv);
                    projectVideoCount++;
                }
            }

            header.textContent = `${subfolderName} (${projectVideoCount} videos)`;
            if (canvasElements.length > 1) {
                state.canvases.set(canvasId, { id: canvasId, name: subfolderName, elements: canvasElements, path: subfolderName });
            }
        };

        App.renderer.prepareScNewRow = async function(subfolderHandle, subfolderName, shortcutFileName, editDirHandle, projectRotationData) {
            const videoBaseName = shortcutFileName.slice(0, -4);
            const videoNameWithoutExt = videoBaseName.substring(0, videoBaseName.lastIndexOf("."));

            const landscapeFiles = [];
            for await (const entry of editDirHandle.values()) {
                if (entry.kind === "file" && entry.name.startsWith(videoNameWithoutExt)) {
                    landscapeFiles.push(await entry.getFile());
                }
            }
            if (landscapeFiles.length === 0) return null;

            landscapeFiles.sort((a, b) => {
                const aNum = parseInt(a.name.substring(a.name.lastIndexOf("_") + 1));
                const bNum = parseInt(b.name.substring(b.name.lastIndexOf("_") + 1));
                return aNum - bNum;
            });

            let realVideoName = videoBaseName, videoDate = "Unknown", videoFile = null;
            try {
                for await (const entry of subfolderHandle.values()) {
                    if (entry.kind === "file" && entry.name.toLowerCase().startsWith(videoBaseName.toLowerCase())) {
                        videoFile = await entry.getFile();
                        realVideoName = videoFile.name;
                        videoDate = new Date(videoFile.lastModified).toLocaleString();
                        break;
                    }
                }
            } catch (e) {}

            const rowData = { videoFile, files: landscapeFiles, hasProjectSc: true, hasRootSc: false, rootScEntry: false };

        App.renderer.renderPlaylistMode = async function() {
            App.renderer.resetState();

            if (!state.g_rootHandle) {
                if (confirm("Would you like to select the root folder to enable root shortcut detection?")) {
                    try {
                        state.g_rootHandle = await window.showDirectoryPicker();

                }
            }

            const rootScData = state.g_rootHandle ? await App.utils.getRootScData(state.g_rootHandle) : new Map();
            const projectFolders = await App.renderer.scanProjectFolders(false);
            await App.renderer.resolveProjectPaths(projectFolders);

            if (projectFolders.length === 0) {
                alert("No \"Edit Thumbnails\" folders found.");
                return;
            }

            const canvasId = App.utils.getNextCanvasId();
            const canvasElements = [];

            for (const project of projectFolders) {
                const projectElements = await App.renderer.preparePlaylistProject(project, rootScData);
                if (projectElements) canvasElements.push(...projectElements);

            state.canvases.set(canvasId, { id: canvasId, name: "Playlist View", elements: canvasElements, path: "" });

        App.renderer.preparePlaylistProject = async function(project, rootScData) {
            try {
                const projectShortcuts = await App.utils.getScDataForProject(project.handle);
                const normalizedProjectName = App.utils.normalizeProjectKey(project.name);
                const normalizedProjectPath = App.utils.normalizeProjectKey(project.path);

                let rootProjectShortcutsMap = rootScData.get(normalizedProjectName) || rootScData.get(normalizedProjectPath) || new Map();

                const videoFiles = [];
                await App.renderer.findVideosRecursive(project.handle, "", videoFiles, false, 0);
                if (videoFiles.length === 0) return null;

                const candidateVideos = await App.renderer.getPlaylistCandidates(project, videoFiles);
                const projectElements = [];

                const header = document.createElement("h2");
                header.className = "project-header";
                header.textContent = `${project.name} (${rootProjectShortcutsMap.size} root shortcuts | ${projectShortcuts.size} subfolder shortcuts)`;
                projectElements.push(header);

                const rowDiv = await App.renderer.createPlaylistRow(project, candidateVideos);
                projectElements.push(rowDiv);

                return projectElements;
            } catch (e) {
                console.warn(`Could not process project "${project.name}" for playlist mode:`, e);

            }
        };

        App.renderer.getPlaylistCandidates = async function(project, videoFiles) {
            videoFiles.sort((a, b) => a.name.localeCompare(b.name));

            const shortcutNames = new Set();
            try {
                const scDirHandle = await project.handle.getDirectoryHandle("sc");
                for await (const entry of scDirHandle.values()) {
                    if (entry.kind === "file") shortcutNames.add(entry.name.toLowerCase());
                }
            } catch (e) {}

            let candidates = videoFiles.filter(v => App.utils.checkShortcut(v.name, shortcutNames));
            if (candidates.length > 5) candidates = candidates.slice(0, 5);

            if (candidates.length < 5) {
                for (const v of videoFiles) {
                    if (!candidates.includes(v)) {
                        candidates.push(v);
                        if (candidates.length >= 5) break;
                    }
                }
            }
            return candidates;
        };

                "",
                "function Verify-Shortcuts {",
                "    param([array]$shortcutPaths)",
                "    if (-not $shortcutPaths) { return }",
                "    Write-Host \"`n--- Verifying Touched Shortcuts ---\" -ForegroundColor Cyan",
                "    foreach ($path in $shortcutPaths) {",
                "        if (Test-Path -LiteralPath $path) {",
                "            try {",
                "                $target = $wshell.CreateShortcut($path).TargetPath",
                "                if (-not (Test-Path -LiteralPath $target)) {",
                "                    Write-Host \"BROKEN: $path -> $target\" -ForegroundColor Red",
                "                } else {",
                "                    Write-Host \"VALID:  $([System.IO.Path]::GetFileName($path))\" -ForegroundColor Green",
                "                }",
                "            } catch {",
                "                Write-Host \"ERROR verifying $([System.IO.Path]::GetFileName($path)): $($_.Exception.Message)\" -ForegroundColor Yellow",
                "            }",
                "        } else {",
                "            Write-Host \"MISSING: $path\" -ForegroundColor Red",
                "        }",
                "    }",
                "}",
                ""
            ];
            const playlistScSelections = selections.filter(s => s.type === 'playlist-sc');

            if (playlistScSelections.length > 0) {
                scriptLines.push("# --- Processing Specific Video Selections ---");
                playlistScSelections.forEach(sel => {
                    const escapedVideoName = App.powershell.escapePSString(sel.videoName);
                    const escapedProjectPath = App.powershell.escapePSString(sel.projectPath);
                    const escapedSubfolder = App.powershell.escapePSString(sel.subfolder);
                    const multiplier = sel.multiplier || 1;
                    const rotation = (sel.buttonRotationTouched && sel.rotation) ? sel.rotation : "0";

                    if (state.currentMode === 'update-playlist-root') {
                        summaryActions.shortcuts_verify.push(`${sel.videoName} (for Playlist)`);
                        scriptLines.push(`\$targetPath = [System.IO.Path]::GetFullPath((Join-Path -Path \"$rootScFolder\" -ChildPath ('${escapedVideoName}' + '.lnk')))`);
                        scriptLines.push(`Add-PlaylistEntry -path \$targetPath -rotation '${rotation}' -multiplier ${multiplier} -rotationKey '${escapedVideoName}'`);
                        scriptLines.push(`Write-Host "Added to playlist (shortcut): ${escapedVideoName} (${multiplier}x)"`);
                    } else {
                        summaryActions.shortcuts_verify.push(`${sel.videoName} (for Playlist)`);
                        let targetPathConstruction = '\$BaseDir';
                        if (sel.projectPath) {
                            targetPathConstruction = `(Join-Path -Path ${targetPathConstruction} -ChildPath '${escapedProjectPath}')`;
                        }
                        if (sel.subfolder) {
                            targetPathConstruction = `(Join-Path -Path ${targetPathConstruction} -ChildPath '${escapedSubfolder}')`;
                        }
                        targetPathConstruction = `Join-Path -Path ${targetPathConstruction} -ChildPath '${escapedVideoName}'`;
                        
                        scriptLines.push(`\$targetPath = [System.IO.Path]::GetFullPath((${targetPathConstruction}))`);
                        scriptLines.push(`Add-PlaylistEntry -path \$targetPath -rotation '${rotation}' -multiplier ${multiplier} -rotationKey '${escapedVideoName}'`);
                        scriptLines.push(`Write-Host "Added to playlist (video): ${escapedVideoName} (${multiplier}x)"`);
                    }
                });
                scriptLines.push('');
            }

            if (rootScSelections.length > 0) {
                scriptLines.push('# --- Processing Root SC Selections ---');
                scriptLines.push('$rootSelections = @{}');
                rootScSelections.forEach(sel => {
                    const escapedProjectPath = App.powershell.escapePSString(sel.projectPath);
                    const multiplier = sel.multiplier || 1;
                    scriptLines.push(`$rootSelections['' + [System.IO.Path]::GetFullPath((Join-Path -Path "$BaseDir" -ChildPath '${escapedProjectPath}'))] = ${multiplier}`);
                });

                scriptLines.push('if (Test-Path -LiteralPath "$rootScFolder") {');
                scriptLines.push('    $rotationCache = @{}');
                scriptLines.push('    $shortcuts = Get-ChildItem -LiteralPath "$rootScFolder" -File | Where-Object { $_.Extension -match \'^\\.(lnk|ink)$\' }');
                scriptLines.push('    foreach ($shortcutFile in $shortcuts) {');
                scriptLines.push('        $targetPath = Get-ShortcutTarget $shortcutFile.FullName');
                scriptLines.push('        if (-not $targetPath) { continue }');
                scriptLines.push('        foreach ($projPath in $rootSelections.Keys) {');
                scriptLines.push('            if ($targetPath.StartsWith($projPath + [IO.Path]::DirectorySeparatorChar, [System.StringComparison]::OrdinalIgnoreCase) -or $targetPath -eq $projPath) {');
                scriptLines.push('                if (-not $rotationCache.ContainsKey($projPath)) { $rotationCache[$projPath] = Get-RotationDataMap $projPath }');
                scriptLines.push('                $rotationMap = $rotationCache[$projPath]');
                scriptLines.push('                $videoName = [System.IO.Path]::GetFileName($targetPath).ToLower()');
                scriptLines.push('                $rotation = if ($rotationMap.ContainsKey($videoName)) { $rotationMap[$videoName] } else { "0" }');
                scriptLines.push('                $multiplier = $rootSelections[$projPath]');
                scriptLines.push('                Add-PlaylistEntry -path $targetPath -rotation $rotation -multiplier $multiplier');
                scriptLines.push('                Write-Host "Added to playlist (root): $($shortcutFile.Name) ($multiplier x, Rotation: $rotation)"');
                scriptLines.push('                break');
                scriptLines.push('            }');
                scriptLines.push('        }');
                scriptLines.push('    }');
                scriptLines.push('}');
                scriptLines.push('');
            }

            if (subfolderScSelections.length > 0) {
                scriptLines.push("# --- Processing Subfolder SC Selections ---");
                scriptLines.push("$subfolderSelections = @{}");
                subfolderScSelections.forEach(sel => {
                    const escapedProjectPath = App.powershell.escapePSString(sel.projectPath);
                    const multiplier = sel.multiplier || 1;
                    let projectPathVar = "$BaseDir";
                    if (sel.projectPath) {
                        projectPathVar = `Join-Path -Path "$BaseDir" -ChildPath '${escapedProjectPath}'`;
                    }
                    scriptLines.push(`$subfolderSelections['' + [System.IO.Path]::GetFullPath((${projectPathVar}))] = ${multiplier}`);
                });

                scriptLines.push("foreach ($projPath in $subfolderSelections.Keys) {");
                scriptLines.push("    if (Test-Path -LiteralPath \"$projPath\") {");
                scriptLines.push("        $multiplier = $subfolderSelections[$projPath]");
                scriptLines.push("        $rotationMap = Get-RotationDataMap $projPath");
                scriptLines.push("        $projectShortcuts = Get-ChildItem -LiteralPath \"$projPath\" -Recurse -File | Where-Object { $_.Extension -match \'^\\\\.(lnk|ink)$\' -and -not $_.FullName.StartsWith($rootScFolder + [IO.Path]::DirectorySeparatorChar, [System.StringComparison]::OrdinalIgnoreCase) }");
                scriptLines.push("        foreach ($shortcutFile in $projectShortcuts) {");
                scriptLines.push("            $targetPath = Get-ShortcutTarget $shortcutFile.FullName");
                scriptLines.push("            if (-not $targetPath) { continue }");
                scriptLines.push("            $videoName = [System.IO.Path]::GetFileName($targetPath).ToLower()");
                scriptLines.push("            $rotation = if ($rotationMap.ContainsKey($videoName)) { $rotationMap[$videoName] } else { \"0\" }");
                scriptLines.push("            Add-PlaylistEntry -path $targetPath -rotation $rotation -multiplier $multiplier");
                scriptLines.push("            Write-Host \"Added to playlist (subfolder): $($shortcutFile.Name) ($multiplier x, Rotation: $rotation)\"");
                scriptLines.push("        }");
                scriptLines.push("    }");
                scriptLines.push("}");
                scriptLines.push("");
            }

            scriptLines.push('$playlistPath = (Join-Path -Path "$BaseDir" -ChildPath "playlist.m3u")');
            scriptLines.push('$script:playlistContent | Out-File -LiteralPath "$playlistPath" -Encoding utf8');
            scriptLines.push('Write-Host "Playlist created at: $playlistPath"');

            scriptLines.push("$luaPath = 'C:\\Bridge\\misc\\tools\\mpv-x86_64-v3-20260418-git-4377cce\\portable_config\\scripts\\autorotate.lua'");
            scriptLines.push('$allRotations = @{}');
            scriptLines.push('if (Test-Path -LiteralPath "$luaPath") {');
            scriptLines.push('    $existingContent = Get-Content -LiteralPath "$luaPath" -Raw');
            scriptLines.push('    if ($existingContent -match \'(?s)local rotations = \\{(.*?)\\}\') {');
            scriptLines.push('        $inner = $matches[1]');
            scriptLines.push('        $entries = $inner -split \',\'');
            scriptLines.push('        foreach ($entry in $entries) {');
            scriptLines.push('            if ($entry -match "\\[[\\\'\\" ]*(.*?) [\\\'\\" ]*\\]\\s*=\\s*[\\\'\\" ]?(\\d+)[\\\'\\" ]?") {');
            scriptLines.push('                $allRotations[$matches[1]] = $matches[2]');
            scriptLines.push('            }');
            scriptLines.push('        }');
            scriptLines.push('    }');
            scriptLines.push('}');
            scriptLines.push('foreach ($file in $script:rotatedFiles.Keys) { $allRotations[$file] = $script:rotatedFiles[$file] }');
            scriptLines.push('if ($allRotations.Count -gt 0) {');
            scriptLines.push('    $luaDir = Split-Path -Parent $luaPath');
            scriptLines.push('    if (-not (Test-Path -LiteralPath $luaDir)) { [System.IO.Directory]::CreateDirectory($luaDir) | Out-Null }');
            scriptLines.push('    $luaContent = @()');
            scriptLines.push("    $luaContent += 'local rotations = {'");
            scriptLines.push('    foreach ($file in $allRotations.Keys) {');
            scriptLines.push('        $rot = $allRotations[$file]');
            scriptLines.push("        $escapedFile = $file.Replace(\"'\", \"\\\\'\")");
            scriptLines.push("        $luaContent += \"    ['$escapedFile'] = $rot,\"");
            scriptLines.push('    }');
            scriptLines.push("    $luaContent += '}'");
            scriptLines.push("    $luaContent += ''");
            scriptLines.push("    $luaContent += 'mp.register_event(\"file-loaded\", function()'");
            scriptLines.push("    $luaContent += '    local path = mp.get_property(\"path\")'");
            scriptLines.push("    $luaContent += '    if not path then return end'");
            scriptLines.push("    $luaContent += ''");
            scriptLines.push("    $luaContent += 'mp.set_property(\"video-rotate\", 0)'");
            scriptLines.push("    $luaContent += ''");
            scriptLines.push("    $luaContent += '    local filename = path:match(\"([^/\\\\\\\\]+)$\") or path'");
            scriptLines.push("    $luaContent += ''");
            scriptLines.push("    $luaContent += '    if rotations[filename] then'");
            scriptLines.push("    $luaContent += '        mp.set_property(\"video-rotate\", rotations[filename])'");
            scriptLines.push("    $luaContent += '    end'");
            scriptLines.push("    $luaContent += 'end)'");
            scriptLines.push('    $luaContent | Out-File -LiteralPath "$luaPath" -Encoding utf8');
            scriptLines.push('    Write-Host "Updated MPV autorotate script at: $luaPath"');
            scriptLines.push('}');

            scriptLines.push('Write-Host "Total items in playlist: $($script:playlistContent.Count - 1)"');
            scriptLines.push('Read-Host -Prompt "Press Enter to exit"');

            App.ui.renderActionSummary(summaryActions);
            const scriptStr = scriptLines.join('\r\n');
            elements.batchScriptTextArea.value = scriptStr;
            const blob = new Blob(['\ufeff', scriptStr], { type: 'application/octet-stream' });
            elements.downloadScriptLink.href = URL.createObjectURL(blob);
            elements.downloadScriptLink.download = 'create_playlist.ps1';
            
            document.getElementById('script-modal-title').textContent = "Create Playlist PowerShell Script";
            document.getElementById('script-modal-desc').textContent = "This script will create a playlist and update rotations. Run it in your main video directory.";
        };

        App.utils.parseRootScData = function(scdataText) {
            const lines = scdataText.split('\n').map(line => line.trim()).filter(line => line);
            const data = new Map();
            let currentSubfolder = "";
            for (let line of lines) {
                const isQuoted = (line.startsWith('"') && line.endsWith('"')) || (line.startsWith("'") && line.endsWith("'"));
                const cleanLine = line.replace(/^["']|["']$/g, '').trim();
                let entry = cleanLine, tag = "";
                if (cleanLine.endsWith('[BOTH]')) { tag = "BOTH"; entry = cleanLine.substring(0, cleanLine.length - 6).trim(); }
                else if (cleanLine.endsWith('[ROOT]')) { tag = "ROOT"; entry = cleanLine.substring(0, cleanLine.length - 6).trim(); }
                const isShortcut = entry.toLowerCase().endsWith('.lnk') || entry.toLowerCase().endsWith('.ink') || entry.toLowerCase().endsWith(' - shortcut.lnk');
                const isVideo = entry.toLowerCase().match(/\.(mp4|mkv|avi|mov|wmv|flv|webm|m4v|mpg|mpeg)$/i);
                if (isQuoted || (!isShortcut && !isVideo && !entry.includes('.') && entry.length > 0)) {
                    currentSubfolder = App.utils.normalizeProjectKey(cleanLine);
                    if (currentSubfolder && !data.has(currentSubfolder)) data.set(currentSubfolder, new Map());
                } else if (entry.length > 0) {
                    if (!data.has(currentSubfolder)) data.set(currentSubfolder, new Map());
                    data.get(currentSubfolder).set(entry.toLowerCase(), tag);
                }
            }
            return data;
        };

        window.App = App;
        App.init();
    </script>
</body>
